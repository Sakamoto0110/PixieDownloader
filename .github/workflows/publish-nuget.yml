# Publica o SDK de plugins (PixieDownloader.Sdk.<apiVersion>.nupkg) de uma release no nuget.org, por Trusted
# Publishing: o NuGet/login troca o token OIDC do GitHub por uma key de minutos — nada guardado em secret. A
# trust policy no nuget.org (conta Nekovih) aponta pra Sakamoto0110/PixieDownloader, workflow
# publish-nuget.yml, environment release — o mesmo desenho do NekoLib.
#
# Dois jeitos de rodar, o mesmo job:
#   - chamado pelo release.yml (workflow_call) logo depois de a release existir, a cada tag;
#   - à mão (Actions → "Publish SDK to nuget.org" → Run workflow → tag), pra publicar o nupkg de uma release
#     que já saiu — ex.: `gh workflow run publish-nuget.yml -f tag=v1.6.1`.
# Nos dois o .nupkg vem dos assets da release (o arquivo que o scripts/release.ps1 gerou), e --skip-duplicate
# faz repetir a mesma versão ser no-op: a versão do pacote é o apiVersion, não a do app.
name: Publish SDK to nuget.org

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag da release de onde tirar o .nupkg (ex.: v1.6.1)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release de onde tirar o .nupkg (ex.: v1.6.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # NuGet/login (Trusted Publishing)

jobs:
  push:
    runs-on: ubuntu-24.04   # empurrar um .nupkg não precisa de nada do Windows
    environment: release    # a policy do nuget.org exige este environment
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'

      - name: Baixar o .nupkg da release
        env:
          GH_TOKEN: ${{ github.token }}
        # Chamado logo depois da release, os assets já estão lá; a retentativa é só folga.
        run: |
          for i in 1 2 3; do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'PixieDownloader.Sdk.*.nupkg' --dir pkg; then
              ls -la pkg; exit 0
            fi
            echo "asset ainda não disponível, tentando de novo em 20 s ($i/3)"; sleep 20
          done
          echo "::error::nenhum PixieDownloader.Sdk.*.nupkg na release $TAG"; exit 1

      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Nekovih

      - name: dotnet nuget push
        run: dotnet nuget push pkg/*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
